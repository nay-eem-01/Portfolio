# Admin panel for the portfolio. Every save is a commit to GitHub; Netlify rebuilds the site after it.
# Sign-in: GitHub, through Netlify's OAuth provider (see README). Only people with write access to the repo can edit.
backend:
  name: github
  repo: nay-eem-01/Portfolio
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    update: "content: update {{slug}}"
    create: "content: add {{slug}}"
    delete: "content: remove {{slug}}"
    uploadMedia: "content: upload {{path}}"
    deleteMedia: "content: delete {{path}}"

# Run `npx decap-server` next to `npm run dev` to edit local files without GitHub.
local_backend: true

site_url: https://nayeem-ahmed-portfolio.netlify.app
display_url: https://nayeem-ahmed-portfolio.netlify.app
logo_url: /images/nayeem.jpg

# Screenshots go here by default.
media_folder: public/projects
public_folder: /projects

collections:
  - name: site
    label: Site
    editor: { preview: false }
    files:
      - name: profile
        label: Profile, about and skills
        file: content/profile.json
        format: json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string, hint: "Shown under your name, e.g. Backend Engineer, Java and Spring Boot" }
          - { name: line, label: One-line introduction, widget: text }
          - { name: now, label: Current position, widget: string, hint: "Shown with the green dot, e.g. Junior Backend Developer at Dhrubok Infotech, Dhaka" }
          - { name: email, label: Email, widget: string }
          - { name: github, label: GitHub URL, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - { name: photo, label: Photo, widget: image, media_folder: /public/images, public_folder: /images, choose_url: false }
          - { name: resume, label: CV (PDF), widget: file, media_folder: /public, public_folder: /, choose_url: false }
          - name: about
            label: About
            widget: object
            fields:
              - { name: lead, label: Opening paragraph (large), widget: text }
              - { name: body, label: Second paragraph, widget: text }
          - name: skills
            label: Skills
            widget: list
            summary: "{{fields.group}}"
            fields:
              - { name: group, label: Group, widget: string }
              - { name: items, label: Skills (comma separated), widget: text }
          - { name: education, label: Education, widget: string }

      - name: experience
        label: Experience
        file: content/experience.json
        format: json
        fields:
          - name: jobs
            label: Jobs (newest first)
            widget: list
            summary: "{{fields.title}} at {{fields.company}}"
            fields:
              - { name: title, label: Job title, widget: string }
              - { name: company, label: Company, widget: string }
              - { name: when, label: Dates as shown, widget: string, hint: "e.g. 2026 to present" }
              - { name: from, label: Start month, widget: string, hint: "YYYY-MM, used by search engines" }
              - { name: summary, label: What you did, widget: text }
              - { name: tags, label: Technologies, widget: list, field: { name: tag, label: Technology, widget: string } }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{order}}. {{name}}"
    sortable_fields: [order, name]
    editor: { preview: false }
    fields:
      - { name: order, label: Order on the homepage, widget: number, value_type: int, default: 9 }
      - { name: slug, label: URL name, widget: string, hint: "Lower case with dashes, e.g. senpai-supply. The page lives at /projects/<this>/. Changing it breaks old links.", pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lower case letters, numbers and dashes only"] }
      - { name: name, label: Project name, widget: string }
      - { name: summary, label: One-sentence summary, widget: text }
      - { name: decision, label: Key decision (shown on the homepage), widget: text }
      - { name: stack, label: Stack (one line), widget: string }
      - { name: image, label: Screenshot, widget: image, required: false, choose_url: false, hint: "16:10 works best. Leave empty to show a 'screenshot coming soon' box." }
      - { name: imageAlt, label: Screenshot description (for screen readers), widget: string }
      - { name: caption, label: Screenshot caption, widget: string, required: false }
      - name: links
        label: Code links
        widget: list
        summary: "{{fields.label}}"
        fields:
          - { name: label, label: Label, widget: string, hint: "e.g. Backend code" }
          - { name: href, label: URL, widget: string }
      - name: live
        label: Live app link
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: label, label: Label, widget: string, required: false, default: Live app }
          - { name: href, label: URL, widget: string, required: false, hint: "Leave empty if there is no live app" }
      - name: meta
        label: Case study details
        widget: object
        fields:
          - { name: role, label: My role, widget: string }
          - { name: stack, label: Full stack, widget: string }
          - { name: status, label: Status, widget: text }
      - { name: problem, label: The problem (one paragraph per item), widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
      - { name: users, label: Who it is for, widget: text }
      - { name: built, label: What I built, widget: list, field: { name: item, label: Item, widget: string } }
      - name: architecture
        label: Architecture and request trace
        widget: object
        collapsed: true
        fields:
          - { name: intro, label: Architecture paragraph, widget: text }
          - { name: label, label: Trace title, widget: string, hint: "e.g. How an order is placed" }
          - name: steps
            label: Trace steps
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Step name, widget: string }
              - { name: text, label: What happens, widget: text }
              - { name: on, label: Boxes to highlight (their ids), widget: list, field: { name: id, label: Box id, widget: string } }
          - name: nodes
            label: Diagram boxes (advanced)
            widget: list
            collapsed: true
            summary: "{{fields.id}}: {{fields.label}}"
            hint: "Positions on a 640 by 260 canvas. Box centres sit at x + 70."
            fields:
              - { name: id, label: Id, widget: string }
              - { name: label, label: Label, widget: string }
              - { name: x, label: X, widget: number, value_type: int }
              - { name: y, label: Y, widget: number, value_type: int }
              - { name: quiet, label: Faded, widget: boolean, required: false, default: false }
          - { name: edges, label: Diagram lines (SVG path, advanced), widget: string }
      - name: decisions
        label: Key decisions
        widget: list
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: Title, widget: string }
          - { name: body, label: Explanation, widget: text }
      - name: solved
        label: How I solved it
        widget: object
        fields:
          - { name: before, label: Before the code, widget: text }
          - { name: code, label: Code (copied from the repo), widget: code, required: false, output_code_only: true, default_language: java }
          - { name: after, label: After the code, widget: text }
      - { name: next, label: "What's next", widget: list, field: { name: item, label: Item, widget: string } }
